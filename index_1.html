<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOSOS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FOSOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5E35CF">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#13101C;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;background:#13101C}
</style>
</head>
<body>
<iframe id="app" title="FOSOS" allow="clipboard-write"></iframe>
<script>
  // URL de la aplicación web de Google Apps Script (la que termina en /exec)
  const APP = "PEGA_AQUI_TU_URL_EXEC";

  const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
  const q = new URLSearchParams(location.search);
  const c = q.get("c") || store.get("fosos_c") || "";
  const n = q.get("n") || store.get("fosos_n") || "";
  const p = new URLSearchParams();
  if (c) p.set("c", c);
  if (n) p.set("n", n);
  document.getElementById("app").src = APP + (p.toString() ? "?" + p : "");

  // La app avisa cuando alguien entra con el código o cambia su nombre:
  // lo guardamos en la dirección para que el icono de la pantalla de inicio lo recuerde.
  window.addEventListener("message", e => {
    const d = e.data && e.data.fosos;
    if (!d || !d.c) return;
    store.set("fosos_c", d.c); store.set("fosos_n", d.n || "");
    const u = new URLSearchParams({c: d.c});
    if (d.n) u.set("n", d.n);
    history.replaceState(null, "", location.pathname + "?" + u);
  });
</script>
</body>
</html>
